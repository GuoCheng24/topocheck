[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "topocheck"
version = "0.1.0"
description = "Sanity checks for topology-aware segmentation claims"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Guo Cheng"}]
keywords = ["segmentation", "topology", "evaluation", "medical-imaging", "connectivity"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=1.21", "scipy>=1.7", "scikit-image>=0.19"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.5", "pillow>=9"]

[project.urls]
Homepage = "https://github.com/GuoCheng24/topocheck"
Issues = "https://github.com/GuoCheng24/topocheck/issues"

[tool.setuptools.packages.find]
include = ["topocheck*"]
